<!-- Coloque estas tags dentro de <manifest>, mas fora de <application> -->

<!-- Permite que o seu app saiba se o Free Fire está instalado (Obrigatório no Android 11+) -->
<queries>
    <package android:name="com.dts.freefireth" />
</queries>

<!-- Declara as permissões necessárias para o funcionamento do app -->
<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
<uses-permission android:name="android.permission.INTERNET" />
