<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL FF FULL RED VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        redvip: {
                            500: '#ff003c',
                            600: '#d60032',
                            800: '#660018',
                            900: '#2b000a',
                            dark: '#0d0003'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050002;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
        }
        .glass-red {
            background: rgba(43, 0, 10, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.15);
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- CABEÇALHO -->
    <header class="w-full p-4 glass-red flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-redvip-500 rounded-lg flex items-center justify-center font-bold text-black font-orbitron">FF</div>
            <div>
                <h1 class="font-orbitron font-black text-xl text-redvip-500 tracking-wider">PAINEL FULL RED</h1>
                <p class="text-xs text-gray-400">Injetor & Otimização VIP</p>
            </div>
        </div>
        <span class="px-3 py-1 bg-redvip-900 border border-redvip-500 rounded-full text-xs text-redvip-500 font-bold">VIP ATIVO</span>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">

        <!-- AJUSTE DE MIRA -->
        <div class="glass-red p-5 rounded-2xl space-y-4">
            <h2 class="font-orbitron font-bold text-redvip-500 text-lg flex items-center gap-2">
                <i class="fa-solid fa-crosshairs"></i> AJUSTE DE MIRA
            </h2>
            <div>
                <label class="text-sm flex justify-between text-gray-300 font-bold">
                    <span>Auxílio de Mira (Regedit Red)</span>
                    <span class="text-redvip-500">95%</span>
                </label>
                <input type="range" class="w-full accent-redvip-500" value="95">
            </div>
            <div>
                <label class="text-sm flex justify-between text-gray-300 font-bold">
                    <span>DPI Virtual Forçada</span>
                    <span class="text-redvip-500">890 DPI</span>
                </label>
                <input type="range" class="w-full accent-redvip-500" value="89">
            </div>
        </div>

        <!-- INJETAR & ABRIR JOGO -->
        <div class="glass-red p-5 rounded-2xl space-y-4">
            <h2 class="font-orbitron font-bold text-redvip-500 text-lg flex items-center gap-2">
                <i class="fa-solid fa-rocket"></i> INJETAR & ABRIR
            </h2>

            <!-- Botão Free Fire Normal -->
            <button onclick="injeteEAbra('com.dts.freefireth')" class="w-full py-4 bg-redvip-500 hover:bg-redvip-600 text-white font-orbitron font-black text-lg rounded-xl shadow-lg transition flex items-center justify-center gap-3">
                <i class="fa-solid fa-play text-2xl"></i> ABRIR FREE FIRE NORMAL
            </button>

            <!-- Botão Free Fire MAX -->
            <button onclick="injeteEAbra('com.dts.freefiremax')" class="w-full py-4 bg-redvip-900/80 hover:bg-redvip-800 border border-redvip-500 text-white font-orbitron font-black text-lg rounded-xl transition flex items-center justify-center gap-3">
                <i class="fa-solid fa-fire text-xl text-redvip-500"></i> ABRIR FREE FIRE MAX
            </button>

            <!-- STATUS DA MENSAGEM -->
            <div id="status-msg" class="hidden text-center py-2 text-sm text-yellow-400 font-bold animate-pulse">
                Injetando módulos... Aguarde!
            </div>
        </div>

    </main>

    <script>
        function injeteEAbra(pkg) {
            const msg = document.getElementById('status-msg');
            msg.classList.remove('hidden');
            msg.innerText = "Injetando Regedit Red e Ajustando DPI...";

            setTimeout(() => {
                msg.innerText = "Configurações aplicadas! Abrindo o jogo...";
                setTimeout(() => {
                    window.location.href = `intent://launch#Intent;package=${pkg};scheme=https;end`;
                }, 1000);
            }, 1500);
        }
    </script>

</body>
              </html>
